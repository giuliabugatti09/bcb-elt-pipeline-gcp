x-airflow-common: &airflow-common
  build:
    context: ..
    dockerfile: docker/Dockerfile
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__TEST_CONNECTION: 'Enabled'
    # Variaveis de ambiente do NOSSO projeto (paths, futuramente credenciais GCP)
    PYTHONPATH: /opt/airflow
    # Necessário porque o airflow-init sobrescreve o entrypoint original
    # da imagem (que normalmente configura o PATH em tempo de execução).
    # Sem isso, o executável 'airflow' (instalado em ~/.local/bin) não
    # é encontrado quando rodamos via 'entrypoint: /bin/bash' diretamente.
    PATH: /home/airflow/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    # Credenciais do Supabase, interpoladas a partir do .env do host —
    # necessárias para o novo módulo de upload (supabase_storage_loader).
    SUPABASE_PROJECT_URL: ${SUPABASE_PROJECT_URL}
    SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
    SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET}
    # Usada pelo postgres_loader.py (Dia 11) para conectar via psycopg2.
    # Ficou faltando propagar até agora porque só era testada localmente,
    # onde python-dotenv lê o .env diretamente — dentro do container,
    # precisa estar declarada aqui.
    SUPABASE_DB_CONNECTION_STRING: ${SUPABASE_DB_CONNECTION_STRING}
    # Credenciais individuais do Postgres, usadas pelo profiles.yml do
    # dbt (que roda dentro deste container a partir de hoje, Dia 16).
    SUPABASE_DB_HOST: ${SUPABASE_DB_HOST}
    SUPABASE_DB_PORT: ${SUPABASE_DB_PORT}
    SUPABASE_DB_USER: ${SUPABASE_DB_USER}
    SUPABASE_DB_PASSWORD: ${SUPABASE_DB_PASSWORD}
    SUPABASE_DB_NAME: ${SUPABASE_DB_NAME}
    # Aponta o dbt para o profiles.yml montado via volume, em vez do
    # padrão ~/.dbt/profiles.yml (que não existe dentro do container).
    DBT_PROFILES_DIR: /opt/airflow/dbt_profiles
  volumes:
    - ../dags:/opt/airflow/dags
    - ../src:/opt/airflow/src
    - ../data:/opt/airflow/data
    - ../dbt_project:/opt/airflow/dbt_project
    - ../docker/dbt_profiles:/opt/airflow/dbt_profiles
    - airflow_logs:/opt/airflow/logs
    - airflow_plugins:/opt/airflow/plugins
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:15
    container_name: airflow_postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_db_volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: always

  airflow-init:
    <<: *airflow-common
    container_name: airflow_init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        /home/airflow/.local/bin/airflow db migrate
        /home/airflow/.local/bin/airflow users create \
          --username airflow \
          --password airflow \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com
    depends_on:
      <<: *airflow-common-depends-on

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow_webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow_scheduler
    command: scheduler
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres_db_volume:
  airflow_logs:
  airflow_plugins: