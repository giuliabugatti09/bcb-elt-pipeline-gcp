version: 2

models:
  - name: stg_bcb_series
    description: >
      Camada de staging sobre raw.bcb_series — tipagem e nomenclatura
      padronizadas, sem lógica de negócio.
    columns:
      - name: nome_serie
        description: Nome da série (ex 'selic_diaria')
        tests:
          - not_null
          - accepted_values:
              values: ['dolar_ptax_venda', 'selic_diaria', 'ipca_mensal']

      - name: data_referencia
        description: Data a que o valor se refere
        tests:
          - not_null

      - name: valor
        description: Valor numérico da série naquela data
        tests:
          - not_null